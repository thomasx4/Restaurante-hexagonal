server:
  port: 9092

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Ruta para tu API principal (que corre en 9091)
        - id: restaurante-api
          uri: http://localhost:9091
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1
      
      # Configuración CORS simple
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.restaurante.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info